# Baseline tests: a quick smoke set (about 5 min) on every pull request into a release branch (and into main), plus the
# suites (game areas) the pull request turns on with a line in its description, e.g. `CI suites: jobs, ui` (or `all`).
# Editing that line re-runs the check. Tiers, suites and timeouts are in test/ci.json; the runner is test/ci.js.
name: Baseline tests

on:
  pull_request:
    branches: ['release-*', main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites to add to the smoke set (e.g. "jobs ui", or "all")'
        required: false
        default: ''

concurrency:
  group: baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the runner image already has Chromium's system libraries; --with-deps runs apt, which can hang on a slow mirror
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install -g playwright@1.56.1
          playwright install chromium
      - name: Run baseline tests
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          CI_SUITES: ${{ inputs.suites }}
        run: NODE_PATH=$(npm root -g) node test/ci.js baseline ci-out
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: baseline-results
          path: ci-out/
          retention-days: 14
