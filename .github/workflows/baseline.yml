# Baseline tests: a quick smoke set (split over parts of about 4 min that run at once,
# 2 to 20 runners) on every pull request into a release branch (and into main), plus the
# suites (game areas) the pull request turns on with a line in its description, e.g. `CI suites: jobs, ui` (or `all`). A suite's
# long tests run only when `soak` is on the line too (`CI suites: village, soak`); `all` includes them.
# Editing that line re-runs the check. Tiers, suites and timeouts are in test/ci.json; the runner is test/ci.js.
name: Baseline tests

on:
  pull_request:
    branches: ['release-*', main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      suites:
        description: 'Suites to add to the smoke set (e.g. "jobs ui", "village soak", or "all")'
        required: false
        default: ''

concurrency:
  group: baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # how many runners this run needs (test/ci.js CI_PLAN: parts of about 4 minutes, from the test times in test/ci-times.json)
  plan:
    runs-on: ubuntu-latest
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
      n: ${{ steps.plan.outputs.n }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: plan
        env:
          CI_PLAN: 1
          PR_BODY: ${{ github.event.pull_request.body }}
          CI_SUITES: ${{ inputs.suites }}
        run: node test/ci.js baseline
  baseline-part:
    needs: plan
    name: baseline part ${{ matrix.part }} of ${{ needs.plan.outputs.n }}
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the runner image already has Chromium's system libraries; --with-deps runs apt, which can hang on a slow mirror
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install -g playwright@1.56.1
          playwright install chromium
      - name: Run baseline tests
        env:
          CI_SHARD: ${{ matrix.part }}/${{ needs.plan.outputs.n }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CI_SUITES: ${{ inputs.suites }}
        run: NODE_PATH=$(npm root -g) node test/ci.js baseline ci-out
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: baseline-results-${{ matrix.part }}
          path: ci-out/
          retention-days: 14
  # one check named baseline that passes only when every part did (the result branch rules and emails look at); skipped when a
  # newer push cancels the run, so a superseded run sends no failure email
  baseline:
    needs: baseline-part
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.baseline-part.result }}" = success ] || { echo "a baseline part failed or was cancelled: ${{ needs.baseline-part.result }}"; exit 1; }'
