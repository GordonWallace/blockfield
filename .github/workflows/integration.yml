# Integration tests: the baseline set plus every other test (soak, simulation and slower feature tests). Runs on the pull
# request that takes a release branch into main, and on demand from the Actions tab (pick the release branch). Not on each
# push to a release branch: release-branch PRs stay light and the full run comes right before a release goes into main.
# The tests are split over as many runners at once as their longest test allows (CI_PLAN and CI_SHARD in test/ci.js),
# about 12, so the run takes about as long as that one test rather than an hour.
# Hosts (spec r15-43): the run covers the three places the game's simulation can run. Host page runs every test (the page opened as
# a file); hosts worker (a Web Worker, the page served without the world server) and server (the Node world server, ./run.sh) run the
# tests whose // @ci header lists them in hosts=, each host split into its own parts. A manual run can pick fewer hosts.
name: Integration tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      hosts:
        description: 'Hosts to run the tests on (any of page worker server)'
        required: false
        default: 'page worker server'

# A newer manual run waits for the running one instead of cancelling it; pull request runs cancel their superseded ones.
concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # how many runners this run needs (test/ci.js CI_PLAN: parts of about 4 minutes, from the test times in test/ci-times.json)
  plan:
    # pull requests into main only run this when they come from a release branch
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-latest
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # one entry {host, part, n} per runner: each host's tests split into parts (test/ci.js CI_PLAN)
      - id: plan
        env:
          CI_PLAN: 1
          CI_PART_SECS: 1
          HOSTS: ${{ inputs.hosts || 'page worker server' }}
        run: |
          runs='[]'
          for h in $HOSTS; do
            n=$(GITHUB_OUTPUT= CI_HOST=$h node test/ci.js integration | sed -n 's/^n=//p')
            echo "host $h: $n part(s)"
            runs=$(node -e 'const [r, h, n] = process.argv.slice(1); const a = JSON.parse(r); for (let k = 1; k <= +n; k++) a.push({ host: h, part: k, n: +n }); console.log(JSON.stringify(a))' "$runs" "$h" "${n:-0}")
          done
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
  integration-part:
    needs: plan
    name: integration ${{ matrix.host }} part ${{ matrix.part }} of ${{ matrix.n }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.runs) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the runner image already has Chromium's system libraries; --with-deps runs apt, which can hang on a slow mirror
      - name: Install Playwright and Chromium
        timeout-minutes: 10
        run: |
          npm install -g playwright@1.56.1
          playwright install chromium
      - name: Run integration tests
        env:
          CI_SHARD: ${{ matrix.part }}/${{ matrix.n }}
          CI_HOST: ${{ matrix.host }}
        run: NODE_PATH=$(npm root -g) node test/ci.js integration ci-out
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: integration-results-${{ matrix.host }}-${{ matrix.part }}
          path: ci-out/
          retention-days: 30
  # one check named integration that passes only when every part did (the result branch rules and emails look at); skipped when a
  # newer push cancels the run, so a superseded run sends no failure email
  integration:
    needs: integration-part
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-')) }}
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.integration-part.result }}" = success ] || { echo "an integration part failed or was cancelled: ${{ needs.integration-part.result }}"; exit 1; }'
