# Integration tests: the baseline set plus the slower soak and simulation tests. Runs on every push to a release branch
# (each merged PR), on the pull request that takes a release branch into main, and on demand from the Actions tab.
name: Integration tests

on:
  push:
    branches: ['release-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    # pull requests into main only run this when they come from a release branch
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and Chromium
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium
      - name: Run integration tests
        run: NODE_PATH=$(npm root -g) node test/ci.js integration ci-out
      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: ci-out/
          retention-days: 30
