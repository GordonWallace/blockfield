<style>
  /* Full-bleed game canvas; modules inject their own UI styles and mount into #ui. Single dark game look. */
  :root {
    --ink: #f4f7ef;
    --muted: #b9c6b0;
    --panel: rgba(18, 22, 20, 0.78);
    --panel-edge: rgba(244, 247, 239, 0.18);
    --accent: #7fbf4d;
    --danger: #e0533d;
    --display: "Silkscreen", ui-monospace, monospace;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body { background: #0e1310; color: var(--ink); overflow: hidden; font-family: var(--mono); font-size: 13px; user-select: none; -webkit-user-select: none; }
  #view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #debug {
    position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: 16px; margin: 0;
    background: var(--panel); color: var(--ink); padding: 8px 10px; border-radius: 3px;
    font: 12px/1.5 var(--mono); white-space: pre; font-variant-numeric: tabular-nums; pointer-events: none;
  }
  #vlog {
    position: fixed; left: 16px; bottom: calc(80px + env(safe-area-inset-bottom, 0px)); width: min(520px, 46vw); max-height: 55vh; overflow: hidden;
    background: var(--panel); color: var(--ink); padding: 8px 10px; border-radius: 3px; font: 11px/1.45 var(--mono); pointer-events: none;
  }
  #vlog h4 { margin: 0 0 2px; font: 13px var(--display); color: var(--accent); }
  #vlog .vl-tally { color: var(--muted); margin-bottom: 4px; }
  #vlog span { color: var(--muted); }
  #vlog .vl-none { color: var(--muted); font-style: italic; }
  #vlog .vl-birth { color: #f3b6c8; } #vlog .vl-bed { color: #9fc8f0; } #vlog .vl-trade { color: #f2dd8a; } #vlog .vl-job { color: #b7e08c; }
  #vlog .vl-birth span, #vlog .vl-bed span, #vlog .vl-trade span, #vlog .vl-job span { color: var(--muted); }
</style>

<canvas id="view" aria-label="Blockfield game view"></canvas>
<div id="ui"></div>
<pre id="debug" hidden></pre>
<div id="vlog" hidden></div>
